[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mindie-bench"
version = "0.4.1"
description = "Controlled, evidence-preserving benchmarks for MindIE Agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
export = ["pyarrow>=19,<24"]

[project.scripts]
mindie-bench = "mindie_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "tier0: pure in-memory core logic under 5s",
    "tier1: local component or process contract under 15s",
    "live_npu: non-destructive live Ascend NPU remote slot verification",
]

[tool.ruff]
line-length = 105

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/mindie_bench"]
