name: reusable-publish-release

on:
  workflow_call:
    secrets:
      MINDIE_RELEASE_DEPLOY_KEY:
        description: Main-only environment key, explicitly forwarded by the caller
        required: true
    inputs:
      benchmark-ref:
        description: Legacy input; callers must use the protected-main controller without a frozen tool pin
        type: string
        required: false
        default: ""
      version-files:
        description: Newline-separated TOML or JSON manifests that must match the tag
        type: string
        default: pyproject.toml
      setup-command:
        description: Install the candidate runtime from its declared dependency pins
        type: string
        default: uv sync --locked --all-extras
      python:
        description: Candidate interpreter relative to checkout
        type: string
        default: .venv/bin/python
      test-command:
        description: Run the candidate's local contracts, excluding live NPU tests
        type: string
        required: true
      build-command:
        description: Build deliverables into RELEASE_ASSETS_DIR
        type: string
        default: uv build --out-dir "$RELEASE_ASSETS_DIR"
      release-notes-path:
        description: Optional repository-relative community release notes
        type: string
        required: false
        default: ""
      node:
        description: Install Node 22 for frontend or npm package builds
        type: boolean
        default: false

env:
  PYTHONUTF8: '1'

permissions:
  contents: read
  actions: read
  checks: read
  deployments: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  credentials:
    runs-on: ubuntu-latest
    environment: mindie-release
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: candidate
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mindie-agent/mindie-bench
          ref: main
          path: release-tool
      - name: Check the real main-only SSH credential before long tests
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          MINDIE_RELEASE_DEPLOY_KEY: ${{ secrets.MINDIE_RELEASE_DEPLOY_KEY }}
        run: |
          python ../release-tool/.github/scripts/release_key.py \
            --repository "$GITHUB_REPOSITORY" --revision "$GITHUB_SHA"

  candidate:
    needs: credentials
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: candidate
    outputs:
      version: ${{ steps.version.outputs.version }}
      tool-ref: ${{ steps.controller.outputs.revision }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: candidate
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            **/pyproject.toml
            **/runtime-requirements.txt
            **/.github/workflows/release.yml
      - if: inputs.node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Match all package versions to the exact tag
        id: version
        env:
          VERSION_FILES: ${{ inputs.version-files }}
          LEGACY_BENCHMARK_REF: ${{ inputs.benchmark-ref }}
          RELEASE_NOTES_PATH: ${{ inputs.release-notes-path }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re, subprocess, tomllib
          assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch", "use the protected main release workflow"
          assert os.environ["GITHUB_REF_TYPE"] == "branch"
          assert os.environ["GITHUB_REF_NAME"] == os.environ["DEFAULT_BRANCH"], "only default-branch sources can publish"
          assert not os.environ["LEGACY_BENCHMARK_REF"], "the protected-main controller resolves one immutable tool revision per run"
          if os.environ["GITHUB_REPOSITORY"] != "mindie-agent/mindie-bench":
              declaration = pathlib.Path(".github/workflows/release.yml").read_text()
              assert re.search(r"uses:\s*mindie-agent/mindie-bench/\.github/workflows/publish-release\.yml@main\s*$",
                               declaration, re.M), "the release entry must follow the protected-main publisher"
          files = os.environ["VERSION_FILES"].splitlines()
          assert files, "at least one version manifest is required"
          first = pathlib.Path(files[0])
          version = (tomllib.loads(first.read_text())["project"]["version"] if first.suffix == ".toml"
                     else json.loads(first.read_text())["version"])
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version)
          tag = "v" + version
          for filename in files:
              path = pathlib.Path(filename)
              if path.suffix == ".toml":
                  actual = tomllib.loads(path.read_text())["project"]["version"]
              else:
                  actual = json.loads(path.read_text())["version"]
              assert actual == version, f"{filename}: {actual} does not match {tag}"
          repo_slug = os.environ.get("GITHUB_REPOSITORY", "").split("/", 1)[-1]
          for readme_name in ("README.md", "README.en.md"):
              readme_path = pathlib.Path(readme_name)
              assert readme_path.is_file(), f"missing required {readme_name}"
              readme_txt = readme_path.read_text(encoding="utf-8")
              badges = re.findall(r"https://img\.shields\.io/badge/[Rr]elease-v([0-9]+\.[0-9]+\.[0-9]+)-", readme_txt)
              assert badges, f"{readme_name}: missing shields.io Release badge for {tag}"
              for b_ver in badges:
                  assert b_ver == version, f"{readme_name}: Release badge v{b_ver} does not match {tag}"
              if repo_slug:
                  for dl_ver, whl_ver in re.findall(
                      rf"github\.com/mindie-agent/{re.escape(repo_slug)}/releases/download/v([0-9]+\.[0-9]+\.[0-9]+)/[A-Za-z0-9_]+-([0-9]+\.[0-9]+\.[0-9]+)-py3-none-any\.whl",
                      readme_txt,
                  ):
                      assert dl_ver == version and whl_ver == version, (
                          f"{readme_name}: wheel URL v{dl_ver}/{whl_ver} does not match {tag}"
                      )
          notes_path = os.environ.get("RELEASE_NOTES_PATH", "").strip()
          if notes_path:
              assert pathlib.Path(notes_path).is_file(), f"release notes file not found: {notes_path}"
              assert version in pathlib.Path(notes_path).name, (
                  f"release-notes-path {notes_path} does not match {tag}"
              )
          revision = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert revision == os.environ["GITHUB_SHA"], "checkout differs from triggering tag"
          assert not subprocess.check_output(["git", "status", "--porcelain", "--untracked-files=all"]), "candidate checkout is dirty"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mindie-agent/mindie-bench
          ref: main
          path: release-tool
      - name: Lock the reviewed controller revision for this entire run
        id: controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          revision=$(git -C ../release-tool rev-parse HEAD)
          python ../release-tool/.github/scripts/release_policy.py --repository mindie-agent/mindie-bench --revision "$revision" --ci-only
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mindie-agent/knowledge
          ref: 3c478a19b5542b38520c7f98b87a07f37e305021
          path: release-consumer
      - name: Require all protected-main source CI to have passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ../release-tool/.github/scripts/release_policy.py --repository "$GITHUB_REPOSITORY" --revision "$GITHUB_SHA" --ci-only
      - name: Install the exact candidate dependencies
        timeout-minutes: 10
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: bash -e -o pipefail -c "$SETUP_COMMAND"
      - name: Require formal first-party dependency releases
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_PYTHON: ${{ inputs.python }}
        run: |
          uv run --no-project --with ../release-consumer python ../release-tool/.github/scripts/check_release_dependencies.py \
            --python "$CANDIDATE_PYTHON" --consumer ../release-consumer --repository "$GITHUB_REPOSITORY"
      - name: Run local component contracts
        timeout-minutes: 30
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -e -o pipefail -c "$TEST_COMMAND"
      - name: Build candidate release deliverables and plugin metadata
        timeout-minutes: 15
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          export RELEASE_ASSETS_DIR="$RUNNER_TEMP/candidate-release-assets"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          mkdir -p "$RELEASE_ASSETS_DIR"
          bash -e -o pipefail -c "$BUILD_COMMAND"
          test -n "$(find "$RELEASE_ASSETS_DIR" -maxdepth 1 -type f ! -name '.*' -print -quit)"
          uv run --no-project --with ../release-consumer python ../release-tool/.github/scripts/prepare_plugin_metadata.py \
            --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --revision "$GITHUB_SHA" \
            --consumer ../release-consumer --source . --assets "$RELEASE_ASSETS_DIR"
          python - <<'PY'
          import hashlib, os, pathlib, subprocess
          assets = pathlib.Path(os.environ["RUNNER_TEMP"]) / "candidate-release-assets"
          for hidden in list(assets.glob(".*")):
              if hidden.is_file():
                  hidden.unlink()
          files = sorted(p for p in assets.iterdir() if p.is_file() and p.name != "candidate-SHA256SUMS")
          assert files, "no candidate deliverables built"
          sums = "".join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n" for p in files)
          (assets / "candidate-SHA256SUMS").write_text(sums, encoding="utf-8", newline="\n")
          assert not subprocess.check_output(["git", "status", "--porcelain", "--untracked-files=all"]), "build changed candidate source"
          PY
      - name: Upload staged candidate release deliverables
        uses: actions/upload-artifact@v4
        with:
          name: candidate-release-assets
          if-no-files-found: error
          path: ${{ runner.temp }}/candidate-release-assets/

  benchmark:
    needs: candidate
    uses: ./.github/workflows/release-benchmark.yml
    with:
      version: ${{ needs.candidate.outputs.version }}
      benchmark-ref: ${{ needs.candidate.outputs.tool-ref }}
      setup-command: ${{ inputs.setup-command }}
      python: ${{ inputs.python }}

  usability-gate:
    needs: [candidate]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
      TOOL_REF: ${{ needs.candidate.outputs.tool-ref }}
      MATRIX_OS: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mindie-agent/mindie-bench
          ref: ${{ needs.candidate.outputs.tool-ref }}
          path: release-tool
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mindie-agent/mindie-agent
          ref: main
          path: hub
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            **/pyproject.toml
            **/runtime-requirements.txt
            **/.github/workflows/release.yml
      - if: >-
          inputs.node
          || github.repository == 'mindie-agent/harness'
          || github.repository == 'mindie-agent/knowledge'
          || github.repository == 'mindie-agent/remote-dev'
          || github.repository == 'mindie-agent/mindie-agent-dsh'
          || github.repository == 'mindie-agent/mindie-agent-oc'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: candidate-release-assets
          path: ${{ runner.temp }}/candidate-assets
      - name: Install usability verifier
        run: uv sync --project release-tool --locked
      - name: Run 3-OS usability qualification gate
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --project release-tool --no-sync python - <<'PY'
          import hashlib, json, os, shutil, subprocess, sys, tarfile
          from pathlib import Path

          sys.path.insert(0, str(Path("release-tool/.github/scripts").resolve()))
          import assemble_candidate_wheelhouse as acw
          import upgrade_acceptance as upg

          flags = {"creationflags": subprocess.CREATE_NO_WINDOW} if os.name == "nt" else {}
          tmp = Path(os.environ["RUNNER_TEMP"]).resolve()
          cand_assets = tmp / "candidate-assets"
          expected_sums = {}
          for line in (cand_assets / "candidate-SHA256SUMS").read_text(encoding="utf-8").splitlines():
              if line.strip():
                  sha, name = line.split(None, 1)
                  expected_sums[name.strip()] = sha.strip().lower()
          actual_files = {
              p.name: hashlib.sha256(p.read_bytes()).hexdigest()
              for p in sorted(cand_assets.iterdir())
              if p.is_file() and not p.name.startswith(".") and p.name != "candidate-SHA256SUMS"
          }
          assert actual_files == expected_sums, (actual_files, expected_sums)

          repo = os.environ["GITHUB_REPOSITORY"]
          rev = os.environ["GITHUB_SHA"]
          ver = os.environ["RELEASE_VERSION"]
          os_name = os.environ["MATRIX_OS"]
          hub_root = Path("hub").resolve()
          details = {}

          if repo in acw.REPOSITORY_PACKAGES:
              base_stage = tmp / "usability-baseline-stage"
              cand_stage = tmp / "usability-candidate-stage"
              acw.assemble_wheelhouse(base_stage)
              reme_cache = tmp / "reme-cache"
              reme_cache.mkdir(parents=True, exist_ok=True)
              with tarfile.open(base_stage / "mindie-wheels-bundle.tar.gz", "r:gz") as tar:
                  for m in tar.getmembers():
                      if m.isfile() and m.name.startswith("reme_ai-") and m.name.endswith(".whl"):
                          (reme_cache / m.name).write_bytes(tar.extractfile(m).read())
              acw.assemble_wheelhouse(
                  cand_stage,
                  candidate_repo=repo,
                  candidate_wheel=cand_assets,
                  candidate_revision=rev,
                  reme_wheel=reme_cache,
              )
              l1 = upg.verify_wheelhouse_upgrade_and_selftest(
                  baseline_stage=base_stage,
                  candidate_stage=cand_stage,
                  work_dir=tmp / "usability-l1",
                  repository=repo,
              )
              details["l1_wheelhouse_upgrade"] = l1
              if repo in {"mindie-agent/harness", "mindie-agent/knowledge", "mindie-agent/remote-dev"}:
                  channel = json.loads((hub_root / "channels/0.1.json").read_text(encoding="utf-8"))
                  chan_ver = tuple(int(x) for x in str(channel.get("current_patch_version") or "0.0.0").split(".")[:3] if x.isdigit())
                  if chan_ver >= (0, 1, 18):
                      plugins_root = tmp / "plugins-root"
                      plugins_root.mkdir(parents=True, exist_ok=True)
                      for item in (channel.get("components") or {}).values():
                          if isinstance(item, dict) and item.get("role") == "harness_plugin":
                              p_repo = item["repository"]
                              p_rev = item["revision"]
                              slug = p_repo.split("/", 1)[1]
                              dest = plugins_root / slug
                              subprocess.run(
                                  ["git", "clone", "--filter=blob:none", "--no-checkout", f"https://github.com/{p_repo}.git", str(dest)],
                                  check=True, timeout=120, **flags,
                              )
                              subprocess.run(["git", "-C", str(dest), "checkout", "-q", p_rev], check=True, timeout=60, **flags)
                      l2_out = tmp / "usability-l2-all-hosts.json"
                      l2_log = tmp / "usability-l2-all-hosts.log"
                      l2_env = {**os.environ, "TMP": str(tmp), "TEMP": str(tmp), "TMPDIR": str(tmp)}
                      with l2_log.open("w", encoding="utf-8") as log_fh:
                          proc = subprocess.run(
                              [
                                  sys.executable, "-I", "-m", "mindie_bench.cli", "host-accept", "--all-hosts",
                                  "--plugins-root", str(plugins_root),
                                  "--wheelhouse-stage", str(cand_stage),
                                  "--baseline-wheelhouse-stage", str(base_stage),
                                  "--install-script", str(hub_root / "install.py"),
                                  "--timeout", "600",
                                  "--output", str(l2_out),
                              ],
                              stdin=subprocess.DEVNULL, stdout=log_fh, stderr=subprocess.STDOUT,
                              env=l2_env, timeout=2700, check=False, **flags,
                          )
                      if proc.returncode != 0:
                          err_summary = ""
                          if l2_out.is_file():
                              try:
                                  doc = json.loads(l2_out.read_text(encoding="utf-8"))
                                  err_summary = json.dumps({
                                      h: r.get("error") or {s: sr.get("error") for s, sr in (r.get("scenarios") or {}).items() if sr.get("error")}
                                      for h, r in (doc.get("hosts") or {}).items()
                                      if r.get("status") != "passed"
                                  }, ensure_ascii=False) + " | "
                              except Exception:
                                  pass
                          tail_log = l2_log.read_text(encoding="utf-8", errors="replace")[-3000:] if l2_log.is_file() else ""
                          raise RuntimeError(f"host-accept --all-hosts failed ({proc.returncode}): {err_summary}{tail_log}")
                      l2 = json.loads(l2_out.read_text(encoding="utf-8"))
                      assert l2.get("status") == "passed", l2
                      details["l2_all_hosts"] = {"status": l2["status"]}
                  else:
                      details["l2_all_hosts"] = {"status": "deferred_until_0_1_18_channel_cutover", "channel_version": channel.get("current_patch_version")}
          elif repo.startswith("mindie-agent/mindie-agent-"):
              host_id = repo.rsplit("mindie-agent-", 1)[1]
              wh_stage = tmp / "usability-plugin-wheelhouse"
              acw.assemble_wheelhouse(wh_stage)
              l2_out = tmp / f"usability-l2-{host_id}.json"
              l2_log = tmp / f"usability-l2-{host_id}.log"
              l2_env = {**os.environ, "TMP": str(tmp), "TEMP": str(tmp), "TMPDIR": str(tmp)}
              with l2_log.open("w", encoding="utf-8") as log_fh:
                  proc = subprocess.run(
                      [
                          sys.executable, "-I", "-m", "mindie_bench.cli", "host-accept",
                          "--host", host_id,
                          "--plugin-dir", str(Path("candidate").resolve()),
                          "--wheelhouse-stage", str(wh_stage),
                          "--install-script", str(hub_root / "install.py"),
                          "--timeout", "600",
                          "--output", str(l2_out),
                      ],
                      stdin=subprocess.DEVNULL, stdout=log_fh, stderr=subprocess.STDOUT,
                      env=l2_env, timeout=900, check=False, **flags,
                  )
              if proc.returncode != 0:
                  tail_log = l2_log.read_text(encoding="utf-8", errors="replace")[-4000:] if l2_log.is_file() else ""
                  raise RuntimeError(f"host-accept --host {host_id} failed ({proc.returncode}): {tail_log}")
              l2 = json.loads(l2_out.read_text(encoding="utf-8"))
              assert l2.get("status") == "passed", l2
              details["l2_host_plugin"] = {"host": host_id, "status": l2["status"]}
          elif repo == "mindie-agent/mindie-bench":
              whls = sorted(cand_assets.glob("mindie_bench-*-py3-none-any.whl"))
              assert len(whls) == 1, whls
              venv_dir = tmp / "bench-wheel-venv"
              subprocess.run(["uv", "venv", "--python", sys.executable, str(venv_dir)], check=True, timeout=60, **flags)
              vpy = venv_dir / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
              subprocess.run(["uv", "pip", "install", "--python", str(vpy), str(whls[0])], check=True, timeout=180, **flags)
              for cmd in (
                  [str(vpy), "-I", "-m", "mindie_bench.cli", "--help"],
                  [str(vpy), "-I", "-m", "mindie_bench.cli", "host-accept", "--help"],
                  [str(vpy), "-I", "-m", "mindie_bench.cli", "demo", "--output", str(tmp / "bench-demo")],
              ):
                  subprocess.run(cmd, cwd=str(tmp), check=True, timeout=60, **flags)
              details["bench_wheel_smoke"] = "passed"
          else:
              raise RuntimeError(f"unclassified repository for usability-gate: {repo}")

          out_dir = tmp / "usability-out"
          out_dir.mkdir(parents=True, exist_ok=True)
          report = {
              "schema": "mindie-usability-acceptance-cell/1",
              "status": "passed",
              "os": os_name,
              "repository": repo,
              "version": ver,
              "revision": rev,
              "asset_sha256": actual_files,
              "details": details,
          }
          (out_dir / f"usability-acceptance-{os_name}.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8", newline="\n"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: usability-acceptance-${{ matrix.os }}
          if-no-files-found: error
          path: ${{ runner.temp }}/usability-out/usability-acceptance-${{ matrix.os }}.json

  publish:
    needs: [candidate, benchmark, usability-gate]
    runs-on: ubuntu-latest
    environment: mindie-release
    timeout-minutes: 240
    defaults:
      run:
        working-directory: candidate
    permissions:
      contents: write
      actions: read
      checks: read
      deployments: read
    env:
      RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: candidate
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mindie-agent/mindie-bench
          ref: ${{ needs.candidate.outputs.tool-ref }}
          path: release-tool
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mindie-agent/knowledge
          ref: 3c478a19b5542b38520c7f98b87a07f37e305021
          path: release-consumer
      - name: Select artifact staging directory
        run: echo "RELEASE_ASSETS_DIR=$RUNNER_TEMP/release-assets" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            **/pyproject.toml
            **/runtime-requirements.txt
            **/.github/workflows/release.yml
      - if: inputs.node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: candidate-release-assets
          path: ${{ env.RELEASE_ASSETS_DIR }}
      - uses: actions/download-artifact@v4
        with:
          name: release-benchmarks
          path: ${{ env.RELEASE_ASSETS_DIR }}
      - uses: actions/download-artifact@v4
        with:
          pattern: usability-acceptance-*
          merge-multiple: true
          path: ${{ runner.temp }}/usability-reports
      - name: Verify usability reports, benchmark provenance, and prepare complete checksums
        env:
          RELEASE_NOTES_PATH: ${{ inputs.release-notes-path }}
          BENCHMARK_REF: ${{ needs.candidate.outputs.tool-ref }}
        run: |
          (cd "$RELEASE_ASSETS_DIR" && sha256sum -c candidate-SHA256SUMS)
          (cd "$RELEASE_ASSETS_DIR" && sha256sum -c benchmark-SHA256SUMS)
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess

          assets = pathlib.Path(os.environ["RELEASE_ASSETS_DIR"])
          cand_sums_path = assets / "candidate-SHA256SUMS"
          cand_sums = {}
          for line in cand_sums_path.read_text(encoding="utf-8").splitlines():
              if line.strip():
                  sha, name = line.split(None, 1)
                  cand_sums[name.strip()] = sha.strip().lower()
          cand_sums_path.unlink()

          usability_dir = pathlib.Path(os.environ["RUNNER_TEMP"]) / "usability-reports"
          expected_oses = ("ubuntu-latest", "macos-latest", "windows-latest")
          cells = {}
          for os_name in expected_oses:
              cell_path = usability_dir / f"usability-acceptance-{os_name}.json"
              assert cell_path.is_file(), f"missing usability report for {os_name}"
              cell = json.loads(cell_path.read_text(encoding="utf-8"))
              assert cell.get("schema") == "mindie-usability-acceptance-cell/1", cell
              assert cell.get("status") == "passed", cell
              assert cell.get("os") == os_name, cell
              assert cell.get("repository") == os.environ["GITHUB_REPOSITORY"], cell
              assert cell.get("version") == os.environ["RELEASE_VERSION"], cell
              assert cell.get("revision") == os.environ["GITHUB_SHA"], cell
              assert cell.get("asset_sha256") == cand_sums, (cell.get("asset_sha256"), cand_sums)
              cells[os_name] = cell

          merged_usability = {
              "schema": "mindie-usability-acceptance/1",
              "status": "passed",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "version": os.environ["RELEASE_VERSION"],
              "revision": os.environ["GITHUB_SHA"],
              "os_matrix": list(expected_oses),
              "asset_sha256": cand_sums,
              "cells": cells,
          }
          (assets / "usability-acceptance.json").write_text(
              json.dumps(merged_usability, indent=2, sort_keys=True) + "\n", encoding="utf-8", newline="\n"
          )

          report = json.loads((assets / "benchmark-results.json").read_text())
          assert report["schema_version"] == "mindie-release-benchmark/2"
          assert report["repository"] == os.environ["GITHUB_REPOSITORY"]
          assert report["version"] == os.environ["RELEASE_VERSION"]
          assert report["release_gate"] is True and not report["blocking_reasons"]
          for key in ("source", "source_after"):
              assert report[key]["revision"] == os.environ["GITHUB_SHA"]
              assert report[key]["dirty"] is False
              assert report["tool"][key]["revision"] == os.environ["BENCHMARK_REF"]
              assert report["tool"][key]["dirty"] is False
          required = [case for case in report["cases"] if case["required"]]
          assert required and all(case["status"] == "pass" for case in required)
          assert report["suite_sha256"] == hashlib.sha256(pathlib.Path("benchmarks/release.json").read_bytes()).hexdigest()
          assert not subprocess.check_output(["git", "status", "--porcelain", "--untracked-files=all"]), "build changed candidate source"
          notes = os.environ.get("RELEASE_NOTES_PATH", "")
          if notes:
              relative = pathlib.Path(notes)
              assert not relative.is_absolute() and ".." not in relative.parts, "release notes must belong to the tagged repository"
              source = relative.resolve()
              source.relative_to(pathlib.Path.cwd().resolve())
              (assets / "release-notes.md").write_bytes(source.read_bytes())
          files = sorted(path for path in assets.iterdir()
                         if path.is_file() and not path.name.startswith(".") and path.name != "SHA256SUMS")
          sums = []
          for path in files:
              with path.open("rb") as stream:
                  sums.append(f"{hashlib.file_digest(stream, 'sha256').hexdigest()}  {path.name}\n")
          (assets / "SHA256SUMS").write_text("".join(sums), encoding="utf-8", newline="\n")
          PY
      - name: Upgrade from a released runtime with the unmodified old updater and wheelhouse stage
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stage_args=()
          if python -c "import os, sys; sys.path.insert(0, '../release-tool/.github/scripts'); import assemble_candidate_wheelhouse as a; raise SystemExit(0 if os.environ['GITHUB_REPOSITORY'] in a.REPOSITORY_PACKAGES else 1)"; then
            python ../release-tool/.github/scripts/assemble_candidate_wheelhouse.py \
              --output-stage "$RUNNER_TEMP/pub-baseline-stage"
            python ../release-tool/.github/scripts/assemble_candidate_wheelhouse.py \
              --candidate-repo "$GITHUB_REPOSITORY" \
              --candidate-wheel "$RELEASE_ASSETS_DIR" \
              --candidate-revision "$GITHUB_SHA" \
              --output-stage "$RUNNER_TEMP/pub-candidate-stage"
            stage_args=(
              --baseline-stage "$RUNNER_TEMP/pub-baseline-stage"
              --candidate-stage "$RUNNER_TEMP/pub-candidate-stage"
            )
          fi
          uv run --no-project --with ../release-consumer python ../release-tool/.github/scripts/upgrade_acceptance.py \
            --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --revision "$GITHUB_SHA" \
            --consumer ../release-consumer --policy ../release-tool/release-policy.json \
            --source . --root "$RUNNER_TEMP/old-client-upgrade" --assets "$RELEASE_ASSETS_DIR" \
            "${stage_args[@]}" \
            --output "$RELEASE_ASSETS_DIR/upgrade-acceptance.json"
          (cd "$RELEASE_ASSETS_DIR" && sha256sum upgrade-acceptance.json >> SHA256SUMS)
      - if: github.repository == 'mindie-agent/mindie-agent-codex'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the two real native hosts for old-client acceptance
        if: github.repository == 'mindie-agent/mindie-agent-codex'
        timeout-minutes: 10
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-legacy" @openai/codex@0.162.1
          npm install --prefix "$RUNNER_TEMP/codex-target" @openai/codex@0.169.0
      - name: Upgrade the old native plugin after independent and external component updates
        if: github.repository == 'mindie-agent/mindie-agent-codex'
        timeout-minutes: 130
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project --with ../release-consumer python ../release-tool/.github/scripts/native_upgrade_acceptance.py accept \
            --root "$RUNNER_TEMP/staged-native-upgrade" --version "$RELEASE_VERSION" --revision "$GITHUB_SHA" \
            --baseline-host "$RUNNER_TEMP/codex-legacy/node_modules/.bin/codex" \
            --target-host "$RUNNER_TEMP/codex-target/node_modules/.bin/codex" \
            --metadata "$RELEASE_ASSETS_DIR/mindie-plugin-release.json" \
            --output "$RELEASE_ASSETS_DIR/native-upgrade-acceptance.json"
          (cd "$RELEASE_ASSETS_DIR" && sha256sum native-upgrade-acceptance.json >> SHA256SUMS)
      - name: Publish verified draft and verify the public result
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          MINDIE_RELEASE_DEPLOY_KEY: ${{ secrets.MINDIE_RELEASE_DEPLOY_KEY }}
        run: |
          python ../release-tool/.github/scripts/release_policy.py --repository "$GITHUB_REPOSITORY" --revision "$GITHUB_SHA" --workflow
          uv run --no-project --with ../release-consumer python ../release-tool/.github/scripts/publish_release.py \
            --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --revision "$GITHUB_SHA" \
            --consumer ../release-consumer --assets "$RELEASE_ASSETS_DIR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-upgrade-evidence
          path: |
            ${{ env.RELEASE_ASSETS_DIR }}/usability-acceptance.json
            ${{ env.RELEASE_ASSETS_DIR }}/upgrade-acceptance.json
            ${{ env.RELEASE_ASSETS_DIR }}/native-upgrade-acceptance.json

  verify-public:
    needs: [candidate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mindie-agent/mindie-bench
          ref: ${{ needs.candidate.outputs.tool-ref }}
          path: release-tool
      - name: Verify public CDN availability and SHA256SUMS integrity
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 release-tool/.github/scripts/verify_public_release.py \
            --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --revision "$GITHUB_SHA" \
            --work-dir "$RUNNER_TEMP/public-release-assets" --output "$RUNNER_TEMP/public-upgrade.json"
          (cd "$RUNNER_TEMP/public-release-assets" && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-public-upgrade-evidence
          path: |
            ${{ runner.temp }}/public-upgrade.json
