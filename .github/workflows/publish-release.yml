name: reusable-publish-release

on:
  workflow_call:
    secrets:
      MINDIE_RELEASE_DEPLOY_KEY:
        description: Main-only environment key, explicitly forwarded by the caller
        required: true
    inputs:
      benchmark-ref:
        description: Legacy input; callers must use the protected-main controller without a frozen tool pin
        type: string
        required: false
        default: ""
      version-files:
        description: Newline-separated TOML or JSON manifests that must match the tag
        type: string
        default: pyproject.toml
      setup-command:
        description: Install the candidate runtime from its declared dependency pins
        type: string
        default: uv sync --locked --all-extras
      python:
        description: Candidate interpreter relative to checkout
        type: string
        default: .venv/bin/python
      test-command:
        description: Run the candidate's local contracts, excluding live NPU tests
        type: string
        required: true
      build-command:
        description: Build deliverables into RELEASE_ASSETS_DIR
        type: string
        default: uv build --out-dir "$RELEASE_ASSETS_DIR"
      release-notes-path:
        description: Optional repository-relative community release notes
        type: string
        required: false
        default: ""
      node:
        description: Install Node 22 for frontend or npm package builds
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  checks: read
  deployments: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  credentials:
    runs-on: ubuntu-latest
    environment: mindie-release
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Require the main-only release credential before long tests
        env:
          MINDIE_RELEASE_DEPLOY_KEY: ${{ secrets.MINDIE_RELEASE_DEPLOY_KEY }}
        run: python -c 'import os; assert os.environ.get("MINDIE_RELEASE_DEPLOY_KEY"), "the main-only release deploy key is unavailable; the caller must explicitly forward its environment secret"'

  candidate:
    needs: credentials
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: candidate
    outputs:
      version: ${{ steps.version.outputs.version }}
      tool-ref: ${{ steps.controller.outputs.revision }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: candidate
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - if: inputs.node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Match all package versions to the exact tag
        id: version
        env:
          VERSION_FILES: ${{ inputs.version-files }}
          LEGACY_BENCHMARK_REF: ${{ inputs.benchmark-ref }}
          RELEASE_NOTES_PATH: ${{ inputs.release-notes-path }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re, subprocess, tomllib
          assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch", "use the protected main release workflow"
          assert os.environ["GITHUB_REF_TYPE"] == "branch"
          assert os.environ["GITHUB_REF_NAME"] == os.environ["DEFAULT_BRANCH"], "only default-branch sources can publish"
          assert not os.environ["LEGACY_BENCHMARK_REF"], "the protected-main controller resolves one immutable tool revision per run"
          if os.environ["GITHUB_REPOSITORY"] != "mindie-agent/mindie-bench":
              declaration = pathlib.Path(".github/workflows/release.yml").read_text()
              assert re.search(r"uses:\s*mindie-agent/mindie-bench/\.github/workflows/publish-release\.yml@main\s*$",
                               declaration, re.M), "the release entry must follow the protected-main publisher"
          files = os.environ["VERSION_FILES"].splitlines()
          assert files, "at least one version manifest is required"
          first = pathlib.Path(files[0])
          version = (tomllib.loads(first.read_text())["project"]["version"] if first.suffix == ".toml"
                     else json.loads(first.read_text())["version"])
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version)
          tag = "v" + version
          for filename in files:
              path = pathlib.Path(filename)
              if path.suffix == ".toml":
                  actual = tomllib.loads(path.read_text())["project"]["version"]
              else:
                  actual = json.loads(path.read_text())["version"]
              assert actual == version, f"{filename}: {actual} does not match {tag}"
          repo_slug = os.environ.get("GITHUB_REPOSITORY", "").split("/", 1)[-1]
          for readme_name in ("README.md", "README.en.md"):
              readme_path = pathlib.Path(readme_name)
              assert readme_path.is_file(), f"missing required {readme_name}"
              readme_txt = readme_path.read_text(encoding="utf-8")
              badges = re.findall(r"https://img\.shields\.io/badge/[Rr]elease-v([0-9]+\.[0-9]+\.[0-9]+)-", readme_txt)
              assert badges, f"{readme_name}: missing shields.io Release badge for {tag}"
              for b_ver in badges:
                  assert b_ver == version, f"{readme_name}: Release badge v{b_ver} does not match {tag}"
              if repo_slug:
                  for dl_ver, whl_ver in re.findall(
                      rf"github\.com/mindie-agent/{re.escape(repo_slug)}/releases/download/v([0-9]+\.[0-9]+\.[0-9]+)/[A-Za-z0-9_]+-([0-9]+\.[0-9]+\.[0-9]+)-py3-none-any\.whl",
                      readme_txt,
                  ):
                      assert dl_ver == version and whl_ver == version, (
                          f"{readme_name}: wheel URL v{dl_ver}/{whl_ver} does not match {tag}"
                      )
          notes_path = os.environ.get("RELEASE_NOTES_PATH", "").strip()
          if notes_path:
              assert pathlib.Path(notes_path).is_file(), f"release notes file not found: {notes_path}"
              assert version in pathlib.Path(notes_path).name, (
                  f"release-notes-path {notes_path} does not match {tag}"
              )
          revision = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert revision == os.environ["GITHUB_SHA"], "checkout differs from triggering tag"
          assert not subprocess.check_output(["git", "status", "--porcelain", "--untracked-files=all"]), "candidate checkout is dirty"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mindie-agent/mindie-bench
          ref: main
          path: release-tool
      - name: Lock the reviewed controller revision for this entire run
        id: controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          revision=$(git -C ../release-tool rev-parse HEAD)
          python ../release-tool/.github/scripts/release_policy.py --repository mindie-agent/mindie-bench --revision "$revision" --ci-only
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mindie-agent/knowledge
          ref: 3c478a19b5542b38520c7f98b87a07f37e305021
          path: release-consumer
      - name: Require all protected-main source CI to have passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ../release-tool/.github/scripts/release_policy.py --repository "$GITHUB_REPOSITORY" --revision "$GITHUB_SHA" --ci-only
      - name: Install the exact candidate dependencies
        timeout-minutes: 10
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: bash -e -o pipefail -c "$SETUP_COMMAND"
      - name: Require formal first-party dependency releases
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_PYTHON: ${{ inputs.python }}
        run: |
          uv run --no-project --with ../release-consumer python ../release-tool/.github/scripts/check_release_dependencies.py \
            --python "$CANDIDATE_PYTHON" --consumer ../release-consumer --repository "$GITHUB_REPOSITORY"
      - name: Run local component contracts
        timeout-minutes: 30
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -e -o pipefail -c "$TEST_COMMAND"

  benchmark:
    needs: candidate
    uses: ./.github/workflows/release-benchmark.yml
    with:
      version: ${{ needs.candidate.outputs.version }}
      benchmark-ref: ${{ needs.candidate.outputs.tool-ref }}
      setup-command: ${{ inputs.setup-command }}
      python: ${{ inputs.python }}

  publish:
    needs: [candidate, benchmark]
    runs-on: ubuntu-latest
    environment: mindie-release
    timeout-minutes: 240
    defaults:
      run:
        working-directory: candidate
    permissions:
      contents: write
      actions: read
      checks: read
      deployments: read
    env:
      RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: candidate
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mindie-agent/mindie-bench
          ref: ${{ needs.candidate.outputs.tool-ref }}
          path: release-tool
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mindie-agent/knowledge
          ref: 3c478a19b5542b38520c7f98b87a07f37e305021
          path: release-consumer
      - name: Select artifact staging directory
        run: echo "RELEASE_ASSETS_DIR=$RUNNER_TEMP/release-assets" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - if: inputs.node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the candidate runtime
        timeout-minutes: 10
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: bash -e -o pipefail -c "$SETUP_COMMAND"
      - name: Build release deliverables
        timeout-minutes: 10
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          mkdir -p "$RELEASE_ASSETS_DIR"
          bash -e -o pipefail -c "$BUILD_COMMAND"
          test -n "$(find "$RELEASE_ASSETS_DIR" -maxdepth 1 -type f -print -quit)"
      - uses: actions/download-artifact@v4
        with:
          name: release-benchmarks
          path: ${{ env.RELEASE_ASSETS_DIR }}
      - name: Verify benchmark provenance and prepare complete checksums
        env:
          RELEASE_NOTES_PATH: ${{ inputs.release-notes-path }}
          BENCHMARK_REF: ${{ needs.candidate.outputs.tool-ref }}
        run: |
          (cd "$RELEASE_ASSETS_DIR" && sha256sum -c benchmark-SHA256SUMS)
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          assets = pathlib.Path(os.environ["RELEASE_ASSETS_DIR"])
          report = json.loads((assets / "benchmark-results.json").read_text())
          assert report["schema_version"] == "mindie-release-benchmark/2"
          assert report["repository"] == os.environ["GITHUB_REPOSITORY"]
          assert report["version"] == os.environ["RELEASE_VERSION"]
          assert report["release_gate"] is True and not report["blocking_reasons"]
          for key in ("source", "source_after"):
              assert report[key]["revision"] == os.environ["GITHUB_SHA"]
              assert report[key]["dirty"] is False
              assert report["tool"][key]["revision"] == os.environ["BENCHMARK_REF"]
              assert report["tool"][key]["dirty"] is False
          required = [case for case in report["cases"] if case["required"]]
          assert required and all(case["status"] == "pass" for case in required)
          assert report["suite_sha256"] == hashlib.sha256(pathlib.Path("benchmarks/release.json").read_bytes()).hexdigest()
          assert not subprocess.check_output(["git", "status", "--porcelain", "--untracked-files=all"]), "build changed candidate source"
          notes = os.environ.get("RELEASE_NOTES_PATH", "")
          if notes:
              relative = pathlib.Path(notes)
              assert not relative.is_absolute() and ".." not in relative.parts, "release notes must belong to the tagged repository"
              source = relative.resolve()
              source.relative_to(pathlib.Path.cwd().resolve())
              (assets / "release-notes.md").write_bytes(source.read_bytes())
          # Match the public upload glob; uv build also creates a private .gitignore.
          files = sorted(path for path in assets.iterdir()
                         if path.is_file() and not path.name.startswith(".") and path.name != "SHA256SUMS")
          sums = []
          for path in files:
              with path.open("rb") as stream:
                  sums.append(f"{hashlib.file_digest(stream, 'sha256').hexdigest()}  {path.name}\n")
          (assets / "SHA256SUMS").write_text("".join(sums))
          PY
      - name: Upgrade from a released runtime with the unmodified old updater
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project --with ../release-consumer python ../release-tool/.github/scripts/upgrade_acceptance.py \
            --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --revision "$GITHUB_SHA" \
            --consumer ../release-consumer --policy ../release-tool/release-policy.json \
            --source . --root "$RUNNER_TEMP/old-client-upgrade" --assets "$RELEASE_ASSETS_DIR" \
            --output "$RELEASE_ASSETS_DIR/upgrade-acceptance.json"
          (cd "$RELEASE_ASSETS_DIR" && sha256sum upgrade-acceptance.json >> SHA256SUMS)
      - if: github.repository == 'mindie-agent/mindie-agent-codex'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the two real native hosts for old-client acceptance
        if: github.repository == 'mindie-agent/mindie-agent-codex'
        timeout-minutes: 10
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-legacy" @openai/codex@0.162.1
          npm install --prefix "$RUNNER_TEMP/codex-target" @openai/codex@0.162.0-alpha.2
      - name: Upgrade the old native plugin after independent and external component updates
        if: github.repository == 'mindie-agent/mindie-agent-codex'
        timeout-minutes: 130
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project --with ../release-consumer python ../release-tool/.github/scripts/native_upgrade_acceptance.py accept \
            --root "$RUNNER_TEMP/staged-native-upgrade" --version "$RELEASE_VERSION" --revision "$GITHUB_SHA" \
            --baseline-host "$RUNNER_TEMP/codex-legacy/node_modules/.bin/codex" \
            --target-host "$RUNNER_TEMP/codex-target/node_modules/.bin/codex" \
            --metadata "$RELEASE_ASSETS_DIR/mindie-plugin-release.json" \
            --output "$RELEASE_ASSETS_DIR/native-upgrade-acceptance.json"
          (cd "$RELEASE_ASSETS_DIR" && sha256sum native-upgrade-acceptance.json >> SHA256SUMS)
      - name: Publish verified draft and verify the public result
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          MINDIE_RELEASE_DEPLOY_KEY: ${{ secrets.MINDIE_RELEASE_DEPLOY_KEY }}
        run: |
          python ../release-tool/.github/scripts/release_policy.py --repository "$GITHUB_REPOSITORY" --revision "$GITHUB_SHA" --workflow
          uv run --no-project --with ../release-consumer python ../release-tool/.github/scripts/publish_release.py \
            --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --revision "$GITHUB_SHA" \
            --consumer ../release-consumer --assets "$RELEASE_ASSETS_DIR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-upgrade-evidence
          path: |
            ${{ env.RELEASE_ASSETS_DIR }}/upgrade-acceptance.json
            ${{ env.RELEASE_ASSETS_DIR }}/native-upgrade-acceptance.json

  verify-public:
    needs: [candidate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 190
    defaults:
      run:
        working-directory: candidate
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: candidate
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mindie-agent/mindie-bench
          ref: ${{ needs.candidate.outputs.tool-ref }}
          path: release-tool
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mindie-agent/knowledge
          ref: 3c478a19b5542b38520c7f98b87a07f37e305021
          path: release-consumer
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Verify normal public discovery and upgrade after publication
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project --with ../release-consumer python ../release-tool/.github/scripts/upgrade_acceptance.py \
            --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --revision "$GITHUB_SHA" \
            --consumer ../release-consumer --policy ../release-tool/release-policy.json --source . \
            --root "$RUNNER_TEMP/public-client-upgrade" --output "$RUNNER_TEMP/public-upgrade.json"
      - if: github.repository == 'mindie-agent/mindie-agent-codex'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the native hosts in the clean public-verification job
        if: github.repository == 'mindie-agent/mindie-agent-codex'
        timeout-minutes: 10
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-legacy" @openai/codex@0.162.1
          npm install --prefix "$RUNNER_TEMP/codex-target" @openai/codex@0.162.0-alpha.2
      - name: Verify normal public native-plugin discovery and activation
        if: github.repository == 'mindie-agent/mindie-agent-codex'
        timeout-minutes: 130
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project --with ../release-consumer python ../release-tool/.github/scripts/native_upgrade_acceptance.py accept \
            --root "$RUNNER_TEMP/public-native-upgrade" --version "$RELEASE_VERSION" --revision "$GITHUB_SHA" \
            --baseline-host "$RUNNER_TEMP/codex-legacy/node_modules/.bin/codex" \
            --target-host "$RUNNER_TEMP/codex-target/node_modules/.bin/codex" \
            --output "$RUNNER_TEMP/public-native-upgrade.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-public-upgrade-evidence
          path: |
            ${{ runner.temp }}/public-upgrade.json
            ${{ runner.temp }}/public-native-upgrade.json
