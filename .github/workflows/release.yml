name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/publish-release.yml
    with:
      release-notes-path: docs/releases/mindie-bench-0.4.3.md
      benchmark-ref: ${{ github.sha }}
      setup-command: |
        uv sync --locked --all-extras
      test-command: |
        bash .github/scripts/setup_linux_sandbox.sh
        .venv/bin/ruff check .
        .venv/bin/python -m pytest -q -m "not live_npu" -k "not actual" --basetemp=/tmp/mb-release
