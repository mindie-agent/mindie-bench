name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: mindie-agent/mindie-bench/.github/workflows/publish-release.yml@26d889179ffe5b4e6803fb127fdfb517a85266f0
    with:
      setup-command: |
        uv sync --locked --all-extras
      test-command: |
        sudo apt-get update -qq
        sudo apt-get install -y bubblewrap
        .venv/bin/ruff check .
        .venv/bin/python -m pytest -q -m "not live_npu" -k "not actual"
