name: release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read
  deployments: read

jobs:
  release:
    uses: ./.github/workflows/publish-release.yml
    secrets:
      MINDIE_RELEASE_DEPLOY_KEY: ${{ secrets.MINDIE_RELEASE_DEPLOY_KEY }}
    with:
      release-notes-path: docs/releases/mindie-bench-0.4.7.md
      setup-command: |
        uv sync --locked --all-extras
      test-command: |
        bash .github/scripts/setup_linux_sandbox.sh
        .venv/bin/ruff check .
        .venv/bin/python -m pytest -q -m "not live_npu" -k "not actual" --basetemp=/tmp/mb-release
