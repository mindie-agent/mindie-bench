name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: mindie-agent/mindie-bench/.github/workflows/publish-release.yml@f65b6bbe39e6d72110341476a2066e30b2adbf77
    with:
      setup-command: |
        uv sync --locked --all-extras
      test-command: |
        bash .github/scripts/setup_linux_sandbox.sh
        .venv/bin/ruff check .
        .venv/bin/python -m pytest -q -m "not live_npu" -k "not actual" --basetemp=/tmp/mb-release
