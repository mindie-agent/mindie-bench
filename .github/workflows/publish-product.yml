name: reusable-publish-product

on:
  workflow_call:
    inputs:
      benchmark-ref:
        description: Exact mindie-bench commit containing this collector and runner
        type: string
        required: true
      release-kind:
        description: Milestone value acceptance or a maintenance patch with component evidence
        type: string
        required: false
        default: milestone
      value-suite-path:
        description: >-
          Optional exact path inside the checked-out product tag to a value suite
          (for example docs/releases/0.0.3/value-suite.json). Leave empty to keep
          the legacy release-tool/benchmarks/product-value-v1.json.
        type: string
        required: false
        default: ""

env:
  PYTHONUTF8: '1'

permissions:
  contents: read

concurrency:
  group: product-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage-product:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.product.outputs.version }}
      channel: ${{ steps.product.outputs.channel }}
      value-suite-schema: ${{ steps.suite.outputs.value_suite_schema }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: product
          persist-credentials: false
      - name: Verify formal product tag and publication inputs
        id: product
        working-directory: product
        env:
          BENCHMARK_REF: ${{ inputs.benchmark-ref }}
          RELEASE_KIND: ${{ inputs.release-kind }}
          VALUE_SUITE_PATH: ${{ inputs.value-suite-path }}
        run: |
          python - <<'PY'
          import os, pathlib, re, subprocess
          tag = os.environ["GITHUB_REF_NAME"]
          assert os.environ["GITHUB_REF_TYPE"] == "tag", "publication requires an existing product tag"
          assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag), "expected vMAJOR.MINOR.PATCH"
          assert re.fullmatch(r"[a-f0-9]{40}", os.environ["BENCHMARK_REF"]), "collector must be pinned"
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == os.environ["GITHUB_SHA"]
          assert not subprocess.check_output(["git", "status", "--porcelain", "--untracked-files=all"])
          version = tag[1:]
          kind = os.environ["RELEASE_KIND"]
          assert kind in {"milestone", "patch"}, "unknown product release kind"
          if kind == "patch":
              major, minor, patch = map(int, version.split("."))
              assert (major > 0 or minor > 0) and patch > 0, "milestones require product value acceptance"
              assert not os.environ.get("VALUE_SUITE_PATH"), "patches do not consume historical value suites"
          manifest = pathlib.Path("docs/releases", version, "benchmark-manifest.json")
          notes = pathlib.Path("docs/releases", version + ".md")
          assert manifest.is_file(), f"missing {manifest.as_posix()}"
          assert notes.is_file(), f"missing {notes.as_posix()}"
          track = ".".join(version.split(".")[:2])
          channel = pathlib.Path("channels", track + ".json")
          assert channel.is_file(), f"missing {channel.as_posix()}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write(f"version={version}\n")
              stream.write(f"channel=product/{channel.as_posix()}\n")
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mindie-agent/mindie-bench
          ref: ${{ inputs.benchmark-ref }}
          path: release-tool
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            **/pyproject.toml
            **/runtime-requirements.txt
            **/.github/workflows/release.yml
      - name: Install fixed benchmark collector
        run: uv sync --project release-tool --locked
      - name: Select the value suite inside the product tag
        if: inputs.release-kind == 'milestone'
        id: suite
        env:
          VALUE_SUITE_PATH: ${{ inputs.value-suite-path }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          product = (workspace / "product").resolve()
          legacy = (workspace / "release-tool/benchmarks/product-value-v1.json").resolve()
          relative = os.environ.get("VALUE_SUITE_PATH", "").strip()
          if relative:
              candidate = pathlib.Path(relative)
              if candidate.is_absolute() or ".." in candidate.parts or "\\" in relative:
                  raise SystemExit("value-suite-path must be a confined relative path in the product tag")
              selected = (product / candidate).resolve()
              if selected == product or product not in selected.parents:
                  raise SystemExit("value-suite-path must stay inside the checked-out product tag")
              if not selected.is_file():
                  raise SystemExit("value-suite-path does not name an existing product-tag file")
          else:
              selected = legacy
              if not selected.is_file():
                  raise SystemExit("legacy release-tool/benchmarks/product-value-v1.json is missing")
          raw = selected.read_bytes()
          suite = json.loads(raw)
          schema = suite.get("schema_version")
          if schema not in {"mindie-value-suite/1", "mindie-value-suite/2"}:
              raise SystemExit("unsupported value suite schema")
          identity = {
              "schema_version": schema,
              "source_path": (
                  selected.relative_to(product).as_posix()
                  if selected.is_relative_to(product)
                  else "release-tool/benchmarks/product-value-v1.json"
              ),
              "sha256": hashlib.sha256(raw).hexdigest(),
              "selected_from_input": bool(relative),
          }
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "product-value"
          output.mkdir(parents=True, exist_ok=True)
          (output / "value-suite.json").write_bytes(raw)
          (output / "value-suite-identity.json").write_text(
              json.dumps(identity, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"value_suite={selected}\n")
              stream.write(f"value_suite_sha256={identity['sha256']}\n")
              stream.write(f"value_suite_schema={schema}\n")
          PY
      - name: Canonicalize the public value suite
        if: inputs.release-kind == 'milestone'
        id: public-suite
        env:
          VALUE_SUITE: ${{ steps.suite.outputs.value_suite }}
          VALUE_SUITE_SCHEMA: ${{ steps.suite.outputs.value_suite_schema }}
          RELEASE_KIND: ${{ inputs.release-kind }}
        run: |
          uv run --project release-tool --no-sync python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from mindie_bench.value_product import public_suite
          source = Path(os.environ["VALUE_SUITE"])
          raw = source.read_bytes()
          suite = json.loads(raw)
          if suite.get("schema_version") != os.environ["VALUE_SUITE_SCHEMA"]:
              raise SystemExit("selected value suite schema changed before canonicalization")
          target = Path(os.environ["RUNNER_TEMP"]) / "product-value/value-suite.json"
          if suite.get("schema_version") == "mindie-value-suite/2":
              public = public_suite(suite)
              data = json.dumps(public, indent=2, sort_keys=True, ensure_ascii=False) + "\n"
              target.write_text(data, encoding="utf-8")
              public_sha = hashlib.sha256(target.read_bytes()).hexdigest()
              identity_path = target.parent / "value-suite-identity.json"
              identity = json.loads(identity_path.read_text())
              identity.update(
                  sha256=public_sha,
                  private_suite_sha256=hashlib.sha256(raw).hexdigest(),
                  public_canonical=True,
              )
              identity_path.write_text(
                  json.dumps(identity, indent=2, sort_keys=True) + "\n", encoding="utf-8"
              )
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
                  stream.write(f"value_suite={target}\n")
                  stream.write(f"value_suite_sha256={public_sha}\n")
          else:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
                  stream.write(f"value_suite={source}\n")
                  stream.write(f"value_suite_sha256={hashlib.sha256(raw).hexdigest()}\n")
          PY
      - name: Require source-matched product value results
        if: inputs.release-kind == 'milestone'
        env:
          PRODUCT_VERSION: ${{ steps.product.outputs.version }}
          VALUE_SUITE: ${{ steps.public-suite.outputs.value_suite }}
        run: |
          test -f "$VALUE_SUITE"
          uv run --project release-tool --no-sync mindie-bench value-verify \
            --suite "$VALUE_SUITE" \
            --evidence "product/docs/releases/$PRODUCT_VERSION/value-evidence.json" \
            --release-manifest "product/docs/releases/$PRODUCT_VERSION/benchmark-manifest.json" \
            --output "$RUNNER_TEMP/product-value"
      - name: Require matching value attachments on component releases
        if: inputs.release-kind == 'milestone'
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_VERSION: ${{ steps.product.outputs.version }}
          VALUE_SUITE: ${{ steps.public-suite.outputs.value_suite }}
        run: |
          uv run --project release-tool --no-sync python \
            release-tool/.github/scripts/attach_product_value.py \
            --suite "$VALUE_SUITE" \
            --evidence "product/docs/releases/$PRODUCT_VERSION/value-evidence.json" \
            --manifest "product/docs/releases/$PRODUCT_VERSION/benchmark-manifest.json" \
            --output "$RUNNER_TEMP/product-value/components" \
            --require-existing
      - name: Download and validate formal component evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_VERSION: ${{ steps.product.outputs.version }}
          CHANNEL_PATH: ${{ steps.product.outputs.channel }}
          VALUE_SUITE_SCHEMA: ${{ steps.suite.outputs.value_suite_schema }}
          RELEASE_KIND: ${{ inputs.release-kind }}
        run: |
          uv run --project release-tool --no-sync python \
            release-tool/.github/scripts/collect_product_benchmarks.py \
            --repository "$GITHUB_REPOSITORY" --version "$PRODUCT_VERSION" \
            --revision "$GITHUB_SHA" \
            --manifest "product/docs/releases/$PRODUCT_VERSION/benchmark-manifest.json" \
            --output "$RUNNER_TEMP/product-benchmarks" --channel "$CHANNEL_PATH"
          if [ "$RELEASE_KIND" = "milestone" ]; then
            cp "product/docs/releases/$PRODUCT_VERSION/value-evidence.json" \
               "$RUNNER_TEMP/product-value/value-results.json" \
               "$RUNNER_TEMP/product-value/value-results.md" \
               "$RUNNER_TEMP/product-value/value-homepage.md" \
               "$RUNNER_TEMP/product-value/value-homepage.en.md" \
               "$RUNNER_TEMP/product-value/value-suite.json" \
               "$RUNNER_TEMP/product-value/value-suite-identity.json" \
               "$RUNNER_TEMP/product-benchmarks/"
            if [ "$VALUE_SUITE_SCHEMA" = "mindie-value-suite/1" ]; then
              cp "$RUNNER_TEMP/product-value/value-suite.json" \
                 "$RUNNER_TEMP/product-benchmarks/product-value-v1.json"
            fi
            tar -C "$RUNNER_TEMP/product-value" -czf \
              "$RUNNER_TEMP/product-benchmarks/component-value-results.tar.gz" components
          fi
          uv run --project release-tool --no-sync python \
            release-tool/.github/scripts/build_wheels_bundle.py \
            --channel "$CHANNEL_PATH" \
            --output "$RUNNER_TEMP/product-benchmarks/mindie-wheels-bundle.tar.gz"
          if [ -f "product/install.py" ]; then
            cp "product/install.py" "$RUNNER_TEMP/product-benchmarks/install.py"
          fi
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "product-benchmarks"
          files = [path for path in sorted(root.iterdir()) if path.is_file() and path.name != "SHA256SUMS"]
          (root / "SHA256SUMS").write_text("".join(
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n" for path in files
          ))
          PY
      - name: Upload staged product assets
        uses: actions/upload-artifact@v4
        with:
          name: staged-product-assets
          if-no-files-found: error
          path: ${{ runner.temp }}/product-benchmarks/

  qualify-product:
    needs: stage-product
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: product
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: mindie-agent/mindie-bench
          ref: ${{ inputs.benchmark-ref }}
          path: release-tool
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            **/pyproject.toml
            **/runtime-requirements.txt
            **/.github/workflows/release.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install fixed benchmark collector and host verifier
        run: uv sync --project release-tool --locked
      - uses: actions/download-artifact@v4
        with:
          name: staged-product-assets
          path: ${{ runner.temp }}/staged-product-assets
      - name: Verify staged bundle, install.py, L1 selftest, and 8-host wire acceptance
        timeout-minutes: 55
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_VERSION: ${{ needs.stage-product.outputs.version }}
          MATRIX_OS: ${{ matrix.os }}
        run: |
          (cd "$RUNNER_TEMP/staged-product-assets" && sha256sum -c SHA256SUMS)
          uv run --project release-tool --no-sync python - <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path

          sys.path.insert(0, str(Path("release-tool/.github/scripts").resolve()))
          import upgrade_acceptance as upg

          flags = {"creationflags": subprocess.CREATE_NO_WINDOW} if os.name == "nt" else {}
          tmp = Path(os.environ["RUNNER_TEMP"]).resolve()
          stage = tmp / "staged-product-assets"
          bundle_sha = hashlib.sha256((stage / "mindie-wheels-bundle.tar.gz").read_bytes()).hexdigest()
          channel_sha = hashlib.sha256((stage / "release-channel.json").read_bytes()).hexdigest()
          install_py = stage / "install.py"
          if not install_py.is_file():
              install_py = Path("product/install.py").resolve()
          assert install_py.is_file(), "install.py is missing from staged product assets"

          # 1. Run install.py --host codex with fail-closed git trap on PATH
          install_box = tmp / "product-install-sandbox"
          base_env = upg._sandbox_env(install_box)
          trap_dir = install_box / "git-trap"
          upg.write_git_trap(trap_dir)
          trap_env = {**base_env, "PATH": f"{trap_dir}{os.pathsep}{base_env.get('PATH', '')}"}
          inst_proc = subprocess.run(
              [sys.executable, "-I", str(install_py), "--host", "codex", "--channel-base-url", stage.as_uri(), "--json"],
              capture_output=True, text=True, encoding="utf-8", errors="replace",
              timeout=300, check=False, env=trap_env, **flags,
          )
          if inst_proc.returncode != 0:
              raise RuntimeError(f"install.py failed ({inst_proc.returncode}): {(inst_proc.stderr or inst_proc.stdout)[-4000:]}")
          inst_payload = json.loads(inst_proc.stdout)
          assert inst_payload.get("status") == "installed", inst_payload
          assert "codex" in (inst_payload.get("configured_hosts") or []), inst_payload

          # 2. Run Gate Layer 1 (mindie-harness selftest --mode full) on the installed bundle runtime
          cfg_path = Path(base_env["MINDIE_CONFIG_HOME"]) / "codex.json"
          data_dir = Path(base_env["MINDIE_DATA_HOME"])
          cfg = json.loads(cfg_path.read_text(encoding="utf-8"))
          codex_py = Path(cfg["python"])
          assert codex_py.is_file(), cfg
          st_proc = subprocess.run(
              [
                  str(codex_py), "-I", "-X", "utf8", "-m", "mindie_harness.cli",
                  "--host", "codex", "--config", str(cfg_path), "--data-dir", str(data_dir),
                  "selftest", "--mode", "full", "--json",
              ],
              capture_output=True, text=True, encoding="utf-8", errors="replace",
              timeout=90, check=False, env=base_env, **flags,
          )
          if st_proc.returncode != 0:
              raise RuntimeError(f"mindie-harness selftest --mode full failed ({st_proc.returncode}): {(st_proc.stderr or st_proc.stdout)[-4000:]}")
          st_payload = json.loads(st_proc.stdout)
          assert st_payload.get("status") == "passed", st_payload

          # 3. Checkout exact 8 harness_plugin commits from release-channel.json and run Gate Layer 2
          channel = json.loads((stage / "release-channel.json").read_text(encoding="utf-8"))
          plugins_root = tmp / "plugins-root"
          plugins_root.mkdir(parents=True, exist_ok=True)
          plugin_commits = {}
          for item in (channel.get("components") or {}).values():
              if isinstance(item, dict) and item.get("role") == "harness_plugin":
                  p_repo = item["repository"]
                  p_rev = item["revision"]
                  slug = p_repo.split("/", 1)[1]
                  dest = plugins_root / slug
                  subprocess.run(
                      ["git", "clone", "--filter=blob:none", "--no-checkout", f"https://github.com/{p_repo}.git", str(dest)],
                      check=True, timeout=120, **flags,
                  )
                  subprocess.run(["git", "-C", str(dest), "checkout", "-q", p_rev], check=True, timeout=60, **flags)
                  head = subprocess.check_output(["git", "-C", str(dest), "rev-parse", "HEAD"], text=True, timeout=15, **flags).strip()
                  assert head == p_rev, (p_repo, head, p_rev)
                  plugin_commits[slug] = p_rev
          expected_slugs = {f"mindie-agent-{h}" for h in ("codex", "cc", "kimi", "dsh", "agy", "wb", "oc", "omp")}
          assert set(plugin_commits) == expected_slugs, plugin_commits

          os_name = os.environ["MATRIX_OS"]
          l2_out = tmp / f"host-accept-{os_name}.json"
          l2_log = tmp / f"host-accept-{os_name}.log"
          l2_env = {**os.environ, "TMP": str(tmp), "TEMP": str(tmp), "TMPDIR": str(tmp)}
          with l2_log.open("w", encoding="utf-8") as log_fh:
              l2_proc = subprocess.run(
                  [
                      sys.executable, "-I", "-m", "mindie_bench.cli", "host-accept", "--all-hosts",
                      "--plugins-root", str(plugins_root),
                      "--wheelhouse-stage", str(stage),
                      "--install-script", str(install_py),
                      "--timeout", "600",
                      "--output", str(l2_out),
                  ],
                  stdin=subprocess.DEVNULL, stdout=log_fh, stderr=subprocess.STDOUT,
                  env=l2_env, timeout=2700, check=False, **flags,
              )
          if l2_proc.returncode != 0:
              err_summary = ""
              if l2_out.is_file():
                  try:
                      doc = json.loads(l2_out.read_text(encoding="utf-8"))
                      err_summary = json.dumps({
                          h: r.get("error") or {s: sr.get("error") for s, sr in (r.get("scenarios") or {}).items() if sr.get("error")}
                          for h, r in (doc.get("hosts") or {}).items()
                          if r.get("status") != "passed"
                      }, ensure_ascii=False) + " | "
                  except Exception:
                      pass
              tail_log = l2_log.read_text(encoding="utf-8", errors="replace")[-3000:] if l2_log.is_file() else ""
              raise RuntimeError(f"host-accept --all-hosts failed ({l2_proc.returncode}): {err_summary}{tail_log}")
          l2_report = json.loads(l2_out.read_text(encoding="utf-8"))
          assert l2_report.get("status") == "passed", l2_report
          raw_hosts = l2_report.get("hosts") or {}
          host_verdicts = {}
          for h in ("codex", "cc", "kimi", "dsh", "agy", "wb", "oc", "omp"):
              h_entry = raw_hosts.get(h) if isinstance(raw_hosts, dict) else None
              t_status = h_entry.get("terminal_status") if isinstance(h_entry, dict) else None
              assert t_status == "completed_pass", (h, h_entry)
              host_verdicts[h] = t_status

          out_dir = tmp / "product-usability-out"
          out_dir.mkdir(parents=True, exist_ok=True)
          cell_report = {
              "schema": "mindie-product-usability-cell/1",
              "status": "passed",
              "os": os_name,
              "version": os.environ["PRODUCT_VERSION"],
              "revision": os.environ["GITHUB_SHA"],
              "bundle_sha256": bundle_sha,
              "channel_sha256": channel_sha,
              "install_py_verified": True,
              "selftest_verified": True,
              "plugin_commits": plugin_commits,
              "hosts": host_verdicts,
          }
          (out_dir / f"product-usability-{os_name}.json").write_text(
              json.dumps(cell_report, indent=2, sort_keys=True) + "\n", encoding="utf-8", newline="\n"
          )
          PY
      - name: Upload OS product usability report
        uses: actions/upload-artifact@v4
        with:
          name: product-usability-${{ matrix.os }}
          if-no-files-found: error
          path: ${{ runner.temp }}/product-usability-out/product-usability-${{ matrix.os }}.json

  publish:
    needs: [stage-product, qualify-product]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: product
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: staged-product-assets
          path: ${{ runner.temp }}/product-benchmarks
      - uses: actions/download-artifact@v4
        with:
          pattern: product-usability-*
          merge-multiple: true
          path: ${{ runner.temp }}/product-usability
      - name: Verify 21/21 host-OS qualification cells and bind product-usability-acceptance.json
        env:
          PRODUCT_VERSION: ${{ needs.stage-product.outputs.version }}
        run: |
          (cd "$RUNNER_TEMP/product-benchmarks" && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          tmp = Path(os.environ["RUNNER_TEMP"])
          bench_root = tmp / "product-benchmarks"
          usability_root = tmp / "product-usability"
          bundle_sha = hashlib.sha256((bench_root / "mindie-wheels-bundle.tar.gz").read_bytes()).hexdigest()
          channel_sha = hashlib.sha256((bench_root / "release-channel.json").read_bytes()).hexdigest()
          expected_oses = ("ubuntu-latest", "macos-latest", "windows-latest")
          expected_hosts = ("codex", "cc", "kimi", "dsh", "agy", "wb", "oc", "omp")
          cells = {}
          passed_cells = 0
          for os_name in expected_oses:
              p = usability_root / f"product-usability-{os_name}.json"
              assert p.is_file(), f"missing product usability report for {os_name}"
              cell = json.loads(p.read_text(encoding="utf-8"))
              assert cell.get("schema") == "mindie-product-usability-cell/1", cell
              assert cell.get("status") == "passed", cell
              assert cell.get("os") == os_name, cell
              assert cell.get("version") == os.environ["PRODUCT_VERSION"], cell
              assert cell.get("revision") == os.environ["GITHUB_SHA"], cell
              assert cell.get("bundle_sha256") == bundle_sha, cell
              assert cell.get("channel_sha256") == channel_sha, cell
              assert cell.get("install_py_verified") is True, cell
              assert cell.get("selftest_verified") is True, cell
              hosts = cell.get("hosts") or {}
              assert set(hosts) == set(expected_hosts), hosts
              for h in expected_hosts:
                  assert hosts[h] == "completed_pass", (os_name, h, hosts[h])
                  passed_cells += 1
              cells[os_name] = cell
          assert passed_cells == 24, passed_cells
          merged = {
              "schema": "mindie-product-usability-acceptance/1",
              "status": "passed",
              "version": os.environ["PRODUCT_VERSION"],
              "revision": os.environ["GITHUB_SHA"],
              "bundle_sha256": bundle_sha,
              "channel_sha256": channel_sha,
              "total_cells": 24,
              "passed_cells": 24,
              "os_matrix": list(expected_oses),
              "hosts": list(expected_hosts),
              "cells": cells,
          }
          (bench_root / "product-usability-acceptance.json").write_text(
              json.dumps(merged, indent=2, sort_keys=True) + "\n", encoding="utf-8", newline="\n"
          )
          excluded_staging = {"SHA256SUMS", "value-homepage.md", "value-homepage.en.md"}
          files = [path for path in sorted(bench_root.iterdir()) if path.is_file() and path.name not in excluded_staging]
          (bench_root / "SHA256SUMS").write_text(
              "".join(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n" for path in files),
              encoding="utf-8",
              newline="\n",
          )
          PY
      - name: Preserve verified public product evidence
        uses: actions/upload-artifact@v4
        with:
          name: product-release-benchmarks
          if-no-files-found: error
          path: ${{ runner.temp }}/product-benchmarks/
      - name: Recheck product tag and create formal release
        working-directory: product
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_VERSION: ${{ needs.stage-product.outputs.version }}
          VALUE_SUITE_SCHEMA: ${{ needs.stage-product.outputs.value-suite-schema }}
          RELEASE_KIND: ${{ inputs.release-kind }}
        run: |
          git fetch --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/release-check/product"
          test "$(git rev-parse 'refs/release-check/product^{commit}')" = "$GITHUB_SHA"
          (cd "$RUNNER_TEMP/product-benchmarks" && sha256sum -c SHA256SUMS)
          cp "docs/releases/$PRODUCT_VERSION.md" "$RUNNER_TEMP/product-release-notes.md"
          assets=(
            "$RUNNER_TEMP/product-benchmarks/benchmark-results.json"
            "$RUNNER_TEMP/product-benchmarks/benchmark-results.md"
            "$RUNNER_TEMP/product-benchmarks/benchmark-SHA256SUMS"
            "$RUNNER_TEMP/product-benchmarks/benchmark-manifest.json"
            "$RUNNER_TEMP/product-benchmarks/product-release-provenance.json"
            "$RUNNER_TEMP/product-benchmarks/product-usability-acceptance.json"
            "$RUNNER_TEMP/product-benchmarks/release-channel.json"
            "$RUNNER_TEMP/product-benchmarks/mindie-wheels-bundle.tar.gz"
            "$RUNNER_TEMP/product-benchmarks/SHA256SUMS"
          )
          if [ "$RELEASE_KIND" = "milestone" ]; then
            assets+=(
              "$RUNNER_TEMP/product-benchmarks/value-evidence.json"
              "$RUNNER_TEMP/product-benchmarks/value-results.json"
              "$RUNNER_TEMP/product-benchmarks/value-results.md"
              "$RUNNER_TEMP/product-benchmarks/value-suite.json"
              "$RUNNER_TEMP/product-benchmarks/value-suite-identity.json"
              "$RUNNER_TEMP/product-benchmarks/component-value-results.tar.gz"
            )
            if [ "$VALUE_SUITE_SCHEMA" = "mindie-value-suite/1" ]; then
              assets+=("$RUNNER_TEMP/product-benchmarks/product-value-v1.json")
            fi
          fi
          if [ -f "$RUNNER_TEMP/product-benchmarks/install.py" ]; then
            assets+=("$RUNNER_TEMP/product-benchmarks/install.py")
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --verify-tag --target "$GITHUB_SHA" --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/product-release-notes.md"
